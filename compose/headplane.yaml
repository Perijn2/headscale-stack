# =============================================================================
# headplane — Tailscale-style admin UI
# =============================================================================
# Headplane (https://github.com/tale/headplane) replicates the look and feel of
# the Tailscale admin console on top of headscale. It does two jobs:
#
#   1. Serves the web dashboard at https://<DOMAIN>/
#   2. PROXIES the Tailscale coordination protocol to headscale's gRPC API.
#
# Because of (2), headplane sits in the HOT PATH of every client login: if it
# is down, devices cannot (re)authenticate even though headscale itself is
# healthy. That is why this service is restart: unless-stopped and gated on
# headscale's health below.
#
# Swap-in note: to use a different frontend (e.g. headscale-admin), replace
# this file and the matching route in ../config/caddy/Caddyfile. Nothing else
# in the stack moves — that isolation is the whole point of this module.
# =============================================================================

services:
  headplane:
    image: ghcr.io/tale/headplane:${HEADPLANE_VERSION:?set HEADPLANE_VERSION in .env}
    container_name: headplane
    restart: unless-stopped

    # Don't start the UI until headscale is actually serving gRPC — otherwise
    # headplane crash-loops against a half-started control plane.
    depends_on:
      headscale:
        condition: service_healthy

    volumes:
      # UI + proxy configuration. NOTE: the real file is GENERATED by
      # install.sh from headplane.yaml.example (it contains the session secret
      # and API key, so the generated file is git-ignored).
      - ../config/headplane/headplane.yaml:/etc/headplane/config.yaml:ro

      # Headplane's own state: sessions, cached API responses.
      - ../data/headplane:/var/lib/headplane

    networks: [controlplane]
    # No published ports: caddy routes to headplane:3000 over the internal
    # network only. The dashboard is never reachable without TLS.
